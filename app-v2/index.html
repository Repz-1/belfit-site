<title>BelFit</title>
<!-- Polices : chargees SANS bloquer la peinture. En feuille de style
     ordinaire, le navigateur n'affichait rien tant que fontshare
     n'avait pas repondu — deux resolutions DNS et un TLS avant le
     premier pixel, et un ecran fige de plusieurs secondes quand le
     reseau traine (Raci, 02/09). media="print" la sort du chemin
     critique, onload la rebranche des qu'elle arrive. -->
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f%5B%5D=satoshi@300,400,500,700,800,900&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://api.fontshare.com/v2/css?f%5B%5D=satoshi@300,400,500,700,800,900&display=swap" rel="stylesheet"></noscript>
<style>
  html,body{margin:0;background:#F4F3F0;font-family:'Satoshi',system-ui,sans-serif;color:#181818}
  #splash{position:fixed;inset:0;z-index:9999;background:#F4F3F0;display:flex;align-items:center;justify-content:center;transition:opacity .25s ease}
  /* Symbole centre, nom en pied d'ecran : on ne lit pas un splash, le
     nom n'est qu'une signature (Raci, 8/08). */
  #splash .sp-sym{width:200px;height:auto}
  /* Le nom seul, sans la ligne « FITNESS · NUTRITION · BIEN-ETRE » :
     a la taille du splash ses capitales faisaient 5px, illisibles, et une
     baseline figee en francais jure avec une app en trois langues
     (Raci, 9/08). Le mot est plus large que haut (ratio 5,06), on lui
     donne 168px pour une hauteur de 33px. */
  #splash .sp-nom{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(52px + env(safe-area-inset-bottom));width:168px;height:auto}
  #splash.parti{opacity:0;pointer-events:none}
</style>
</head>
<body>
<!-- Splash : reste jusqu'au premier rendu. Fond clair depuis le 8/08
     (Raci) : meme valeur que le fond de l'app, donc aucun flash entre le
     splash et le premier ecran. -->
<div id="splash">
  <img class="sp-sym" src="/belfit-logo-bf.png" alt="BelFit">
  <img class="sp-nom" src="/belfit-nom.png" alt="BelFit">
</div>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="gradOr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC933"/>
      <stop offset="100%" stop-color="#F7B500"/>
    </linearGradient>
  </defs>
</svg>
<div id="app"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
