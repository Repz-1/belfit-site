<!DOCTYPE html>
<html lang="fr">
<head>
<script src="i18n-strings.js?v=42"></script>
<script src="i18n.js?v=4"></script>
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="stylesheet" href="/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F4F3F0">
<meta name="robots" content="noindex">
<title>BelFit — Confirmation</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root{ --bg:#F4F3F0; --text:#16130F; --muted:#5C564E; }
html{ background:var(--bg); }
body{
  font-family:"Satoshi",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text);
  line-height:1.55; -webkit-font-smoothing:antialiased;
  min-height:100vh; min-height:100dvh;
  display:flex; align-items:center; justify-content:center;
  padding:32px 20px; text-align:center;
}
.page{ width:100%; max-width:26rem; }
.logo{ display:block; width:min(180px,55vw); height:auto; margin:0 auto 1.75rem; }
.attente{ font-size:1rem; font-weight:500; color:var(--muted); }
.vue{ display:none; }
.vue.active{ display:block; }
.gros{ font-size:clamp(2rem,9vw,2.6rem); font-weight:800; letter-spacing:-.035em; line-height:1.12; margin-bottom:1.1rem; }
.corps{ font-size:1.1rem; color:var(--muted); margin-bottom:2rem; }
.corps i{ font-style:normal; }
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  font-family:inherit; font-weight:700; font-size:.95rem;
  padding:.85rem 1.75rem; border-radius:999px; border:2px solid transparent;
  background:var(--text); color:#fff; cursor:pointer; white-space:nowrap;
}
.btn:active{ transform:scale(.98); }
</style>
</head>
<body>

<main class="page">
  <img class="logo" src="belfit-logo-bf.png" width="180" height="74" alt="BelFit">

  <!-- 1. Verification du jeton en cours -->
  <div class="vue active" id="vueAttente">
    <p class="attente" data-i18n="verif_checking">Confirmation en cours…</p>
  </div>

  <!-- 2. Resultat : adresse confirmee ou lien perime -->
  <div class="vue" id="vueFin">
    <h1 class="gros" id="finGros"></h1>
    <p class="corps" id="finTexte"></p>
    <button type="button" class="btn" id="finBouton" style="visibility:hidden">
      <span id="finBoutonTxt"></span>
    </button>
  </div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAN07MM-t2wIPSwoo0shrV1OfMfIDC-Z0I",
  authDomain: "repz-baf60.firebaseapp.com",
  projectId: "repz-baf60",
  storageBucket: "repz-baf60.firebasestorage.app",
  messagingSenderId: "403252293048",
  appId: "1:403252293048:web:e7db6aed4ba92f0ebfb34d"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const params = new URLSearchParams(location.search);
const codeVerif = params.get('code') || params.get('oobCode') || '';
const langUrl = (params.get('lang') || '').slice(0, 2);

// La langue du courriel s'applique seulement si l'appareil n'a pas
// deja un choix explicite : on ne contredit jamais l'utilisateur.
if (langUrl && window.BELFIT_I18N && BELFIT_I18N.LANGS.indexOf(langUrl) !== -1 && !BELFIT_I18N.langChoisie()) {
    BELFIT_I18N.setLang(langUrl);
}

function montrer(idVue){
    document.querySelectorAll('.vue').forEach(function(v){ v.classList.remove('active'); });
    document.getElementById(idVue).classList.add('active');
}

function ecranFin(cleGros, cleTexte, cleBouton, destination){
    document.getElementById('finGros').innerHTML =
        window.t(cleGros);
    document.getElementById('finTexte').innerHTML = window.t(cleTexte);
    const b = document.getElementById('finBouton');
    document.getElementById('finBoutonTxt').textContent = window.t(cleBouton);
    b.style.visibility = 'visible';
    b.onclick = function(){ location.href = destination; };
    montrer('vueFin');
}

// Le bouton mene DIRECTEMENT a l'application : la session ouverte sur
// cet appareil reste valide apres la confirmation, l'utilisateur n'a
// donc pas a repasser par l'ecran de connexion.
var VERS_APP = 'v2/';

if (!codeVerif) {
    ecranFin('verif_bad_gros', 'verif_bad_txt', 'verif_bad_btn', 'index.html');
} else {
    auth.applyActionCode(codeVerif).then(function(){
        // La session ouverte sur cet appareil porte encore l'ancien
        // etat : on la rafraichit pour que l'app voie la confirmation.
        if (auth.currentUser) { try { auth.currentUser.reload(); } catch (e) {} }
        ecranFin('verif_ok_gros', 'verif_ok_txt', 'verif_ok_btn', VERS_APP);
    }).catch(function(){
        ecranFin('verif_bad_gros', 'verif_bad_txt', 'verif_bad_btn', 'index.html');
    });
}
</script>
</body>
</html>
